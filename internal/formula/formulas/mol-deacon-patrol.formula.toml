**THE LESSON, AND IT IS THE WHOLE REASON THIS STEP EXISTS:** "the source is fixed" and
"the next session is safe" REMAIN DIFFERENT CLAIMS even after the source fix lands. A
source fix repairs ONE defect; it does not carry forward the accumulated patches of the
lineage it replaces, and a fresh pour can be simultaneously safer AND more regressed than
the wisp it succeeds. **Diff every pour against the served text. Never assume a newer
pour dominates an older one.**

**Therefore the ban must travel in the document itself.** Before this cycle ends, if a
next patrol wisp has been poured, patch it before you finish:

```bash
# 1. Read the SERVED text of the next patrol wisp (not the formula file):
bd show <next-wisp-id>
# 2. If its inbox-check step contains a runnable 'bd mol wisp gc' command, it is ARMED.
