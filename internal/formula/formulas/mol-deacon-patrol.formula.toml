```

This aggregates the past 7 days of compaction event beads and sends
trend data (totals, promotion rate, avg deleted/day) to mayor/.
Skips automatically if this week's rollup was already sent.

**Exit criteria:** Compaction digest sent (or nothing to report)."""

[[steps]]
id = "costs-digest"
title = "Aggregate daily costs [DISABLED]"
needs = ["compact-report"]
description = """
**⚠️ DISABLED** - Skip this step entirely.

Cost tracking is temporarily disabled because Claude Code does not expose
session costs in a way that can be captured programmatically.

**Why disabled:**
- The `gt costs` command uses tmux capture-pane to find costs
- Claude Code displays costs in the TUI status bar, not in scrollback
- All sessions show $0.00 because capture-pane can't see TUI chrome
- The infrastructure is sound but has no data source

**What we need from Claude Code:**
- Stop hook env var (e.g., `$CLAUDE_SESSION_COST`)
- Or queryable file/API endpoint

**Re-enable when:** Claude Code exposes cost data via API or environment.

See: GH#24, gt-7awfj

**Exit criteria:** Skip this step - proceed to next."""

[[steps]]
id = "patrol-digest"
title = "Aggregate daily patrol digests"
needs = ["costs-digest"]
description = """
**DAILY DIGEST** - Aggregate yesterday's patrol cycle digests.

Patrol cycles (Deacon, Witness, Refinery) create ephemeral per-cycle digests
to avoid JSONL pollution. This step aggregates them into a single permanent
"Patrol Report YYYY-MM-DD" bead for audit purposes.

**Step 1: Check if digest is needed**
```bash
# Preview yesterday's patrol digests (dry run)
gt patrol digest --yesterday --dry-run
```

If output shows "No patrol digests found", skip to Step 3.

**Step 2: Create the digest**
```bash
gt patrol digest --yesterday
```

This:
- Queries all ephemeral patrol digests from yesterday
- Creates a single "Patrol Report YYYY-MM-DD" bead with aggregated data
- Deletes the source digests

**Step 3: Verify**
Daily patrol digests preserve audit trail without per-cycle pollution.

**Timing**: Run once per morning patrol cycle. The --yesterday flag ensures
we don't try to digest today's incomplete data.

**Exit criteria:** Yesterday's patrol digests aggregated (or none to aggregate)."""

[[steps]]
id = "log-maintenance"
title = "Rotate logs and prune state"
needs = ["patrol-digest"]
description = """
Maintain daemon logs and state files.

> ## ⛔ ROTATION EXCLUSION — /gt/.beads/interactions.jsonl ⛔
>
> **Do NOT rotate, truncate, prune, or delete `/gt/.beads/interactions.jsonl`, and do
> not run any rotation that would.** Until further notice (mayor order, 2026-09-01),
> it is the **sole surviving record of wisp history** after the 1449-wisp loss — the
> Dolt `interactions` TABLE is empty (0 rows), so this local append-only FILE is the
> only copy. Its only backups are:
> `/gt/deacon/incident-2026-09-01-wispgc/interactions-snapshot-160Z.jsonl`
>   sha256 `92b667621c28c0dfd7613677c7d1ac46f78039cf0b710e8d9bd75a3d4a8011dc`
> `/gt/deacon/incident-2026-09-01-wispgc/issues-snapshot-1511Z.jsonl`
>   sha256 `aac3619b82a6e8cc397333e82aefae238aeb19b7c103cab1e4d9453d958dc5f0`
> **Verify both sha256s each cycle** and re-snapshot if the live file has grown.
> LATER SNAPSHOTS EXIST and are NOT covered by the two hashes above — as of
> 2026-09-01T23:00Z the directory also holds interactions-snapshot-2007Z /
> -2235Z / -2300Z.jsonl, each with its sha256 appended to `snapshot-hashes.txt`
> in the same directory. **Do not read the two-hash list above as the full
> backup inventory** — it is a fixed pair of anchors, not a census. `ls` the
> directory and `cat snapshot-hashes.txt` for the real one. The 2300Z snapshot
> (6932 lines) was taken this cycle because the live file had grown past 2235Z
> (6900); `gt daemon rotate-logs` was a no-op ("below threshold") and left
> interactions.jsonl byte-identical, verified by sha256 either side.
> See hq-gk8d and hq-qi3a.

**Step 1: Rotate oversized logs**

The daemon automatically rotates logs every heartbeat (3 min), but the deacon
can trigger a force-rotation to ensure cleanup happens during patrol:
```bash
gt daemon rotate-logs
```

This rotates Dolt server logs (dolt.log, dolt-server.log, rig-level dolt-server.log)
using copytruncate (safe for child processes with open fds). daemon.log uses
lumberjack for automatic rotation and is handled separately.

Log locations: $GT_ROOT/daemon/dolt.log, $GT_ROOT/daemon/dolt-server.log,
and per-rig .beads/dolt-server.log files.

**Step 2: Prune state.json of dead sessions**

The state.json tracks active sessions. Prune entries for sessions that no longer exist:
```bash
# Check for stale session entries
gt daemon status --json 2>/dev/null
```

If state.json references sessions not in tmux:
- Remove the stale entries
- The daemon's internal cleanup should handle this, but verify

**Note**: Log rotation prevents disk bloat from long-running daemons.
State pruning keeps runtime state accurate."""

[[steps]]
id = "patrol-cleanup"
title = "End-of-cycle inbox hygiene"
needs = ["log-maintenance"]
description = """
Verify inbox hygiene before ending patrol cycle.

**Step 1: Check inbox state**
```bash
gt mail inbox
```

Inbox should be EMPTY or contain only just-arrived unprocessed messages.

**Step 2: Archive any remaining processed messages**

All message types should have been archived during inbox-check processing:
- HELP/Escalation → archived after handling
- LIFECYCLE → archived after processing

If any were missed:
```bash
# For each stale message found:
gt mail archive <message-id>
```

**Goal**: Inbox should have ≤2 active messages at end of cycle.
Deacon mail should flow through quickly - no accumulation."""

[[steps]]
id = "context-check"
title = "Check own context limit"
needs = ["patrol-cleanup"]
description = """
Check own context limit.

The Deacon runs in a Claude session with finite context. Check if approaching the limit:

> **⛔ `gt context --usage` DOES NOT EXIST — there is no `gt context` command
> at all.** Re-confirmed 2026-09-01T23:00Z. Do not run it and do not report its
> failure as a context reading. SELF-ASSESS instead: judge remaining headroom
> from the size of this session's own transcript and say so in one sentence,
> naming it as a self-assessment rather than a measurement.

If context is high (>80%), prepare for handoff:
- Summarize current state
- Note any pending work
- Write handoff to molecule state

This enables the Deacon to burn and respawn cleanly."""

[[steps]]
id = "served-wisp-audit"
title = "Propagate this patch to the next patrol wisp"
needs = ["context-check"]
description = '''
**A wisp description is a SNAPSHOT TAKEN AT POUR TIME.** A wisp poured before a fix
carries the armed text forever, and *the wisp is what executes* — not the formula file.
"The formula file is patched" is NOT the same claim as "what the next session will be
told to do is patched." That gap is what destroyed 1449 wisps on 2026-09-01.

**MERGE PERFORMED 2026-09-01T22:40Z (deacon) — A WORKED EXAMPLE OF WHY THIS STEP SAYS DIFF, NOT OVERWRITE.**
The served wisp hq-wisp-f09e and the newer-poured hq-wisp-kx5qv each carried text the other
lacked, in BOTH directions, exactly as the divergence block at the top predicts:
  f09e ONLY:  Step 0, Step 24 rotation exclusion, Step 26b, Step 27 TRIAGE block + check-3,
              the hq-gk8d-era Step 2 prohibition (Harm 4 / never-follow-the-hint / served-wisp).
  kx5qv ONLY: the Step 2 DOG-CLEARING guard as amended cycle 646 (mayor-authorized, hq-z70b) —
              "ABSENCE NEVER SATISFIES (a)", pane-as-primary-instrument, and the (b)
              positive-listing requirement.
f09e still contained the exact clause that amendment STRUCK (the one blessing a `bd show` miss
as a pass, citing hq-r0l9 — deliberately NOT quoted verbatim here, so that the invariant grep
below stays a clean binary instead of matching this note). Overwriting kx5qv with f09e would have silently
REVERTED a mayor directive and restored a permissive hole in front of a `--force`; overwriting
f09e with kx5qv would have dropped Step 0 and the Step 24 exclusion. NEITHER wisp was a safe
base. The merged text below takes f09e as the base and restores kx5qv's newer (a)/(b) block.
Verified after write by re-reading STORED text: 0 runnable `bd mol wisp gc` lines,
0 lines matching `^ *\(a\) .bd show <mol>.` (the struck clause, gone), and the
operative "ABSENCE NEVER SATISFIES" present in Step 2. (Total string count is 3, not 1 — this
provenance note mentions it twice. Count LINES IN STEP 2, not whole-document occurrences.)
NOTE ALSO, for whoever maintains `log-maintenance`: its "only backups" list names just the 160Z and 1511Z
snapshots, but 2007Z and 2235Z snapshots now exist in the same directory. That list is stale.
And `context-check` tells you to run `gt context --usage`; there is no `gt context` command at all.
Both of those are now FIXED IN THIS TEXT (2026-09-01T23:00Z) rather than merely flagged.

**NEW, FINDING-GRADE, ADDED 2026-09-01T23:00Z — THE WRONG-CWD ALL-CLEAR. Same
permissive-empty family as everything else on this document, new surface.**
`bd` resolves its database FROM THE CURRENT WORKING DIRECTORY. Run it from a
directory outside a beads workspace (a scratchpad, /tmp, a dog worktree) and it
does not return empty — it EXITS WITH AN ERROR: "Error: no beads database
found". The trap is what happens next: if you are auditing with a counter such
as `grep -c PATTERN <output>`, the error text does not match your pattern, so
the counter returns **0**, and 0 reads as CLEAN. Measured live this cycle: an
invariant sweep of all 9 hooked/pinned wisps was run with a `cd` into a
scratchpad first, and reported `armed_runnable=0 PROHIBITED=0 gc_mentions=0`
for every wisp — i.e. it simultaneously claimed the wisps were disarmed AND
that the prohibition text was missing, which is self-contradictory. Re-run from
/gt/deacon the same sweep returned 1808-line documents with PROHIBITED=4 and
gc_mentions=5. **A three-line file was being graded as a patrol wisp.**
RULE: any audit loop that greps command output MUST first assert the command
SUCCEEDED and that the output is the expected SHAPE — check the exit status,
or `grep -q '^Error:'`, or simply that the byte/line count is plausible — before
believing a zero. A zero from a command that never ran is not a measurement.
And state the seat/cwd you audited from, the same way prefix resolution already
requires (hq-5fj6).

**PROVENANCE, 2026-09-01T23:0xZ — THE SOURCE FORMULA IS NOW FIXED, AND THE POUR IS STILL NOT SAFE.**
gt-9ab ("strip hq-hazr-banned wisp GC from the patrol formula SOURCES") landed on gastown
origin/main at 1b276db0..6782d066 this cycle. The next wisp poured after it, hq-wisp-xa4dw,
was measured immediately and is GENUINELY UNARMED: its Step 2 code fence now reads
`# REMOVED — see the PROHIBITED block below. Run nothing here.`, and its only two
`bd mol wisp gc` occurrences are both prohibition prose. That is the fix of record working.
**BUT THE SAME POUR WAS REGRESSED ON FOUR BLOCKS THAT ONLY EVER LIVED IN THE SERVED-WISP
LINEAGE:** it had NO Step 0 brief-in, NO Step 24 rotation exclusion (the interactions.jsonl
protection — the sole surviving record of wisp history), NO Step 26b, and NO Step 27
TRIAGE-FIRST block or its check-3 property test (so its Step 27 still said "Reset the idle
