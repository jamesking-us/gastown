[[steps]]
id = "loop-or-exit"
title = "Loop or exit for respawn"
needs = ["served-wisp-audit"]
description = """
End of patrol cycle decision.

**If context LOW** (can continue patrolling):

Refresh the heartbeat again immediately before the long idle wait:

```bash
gt deacon heartbeat "pre-await checkpoint"
```

Use await-signal with exponential backoff to wait for activity:

```bash
gt mol step await-signal --agent-bead hq-deacon \
  --backoff-base 60s --backoff-mult 2 --backoff-max 15m
```

This command:
1. Subscribes to `bd activity --follow` (beads activity feed)
2. Returns IMMEDIATELY when any beads activity occurs
3. If no activity, times out with exponential backoff:
   - First timeout: 60s
   - Second timeout: 120s
   - Third timeout: 240s
   - ...capped at 15 minutes max
4. Tracks `idle:N` label on hq-deacon bead for backoff state
5. Outputs `EFFORT: reduced` or `EFFORT: full` directive for next cycle

**On signal received** (activity detected) — ⛔ TRIAGE FIRST, THEN DECIDE ⛔
(mayor order 2026-09-01, hq-wisp-n72j; tracked on **hq-zj0l**)

**DO NOT reset the idle counter just because a signal arrived.** `await-signal`
returns on ANY beads activity and carries no notion of whose activity it is or
whether it represents WORK — an infrastructure heartbeat is indistinguishable
from a polecat finishing a task. Measured: `boot` emits a `session_start` every
~17 minutes (15:20:48, 15:37:57, 15:55:08, 16:12:31, 16:29:33, 16:53:07,
17:10:04). Each one used to reset the counter, so the backoff collapsed
60s -> 2m -> 4m -> 8m -> SIGNAL -> 60s forever, and a fully idle town got a FULL
27-STEP PATROL every ~17 minutes indefinitely.

**RUN THE TRIAGE CHECK — three cheap queries:**
```bash
gt mq list <each rig>          # any merge-queue entries?
gt mail inbox                  # any messages?

# Check 3 — PROPERTY TEST, not an enumeration of bad states:
gt polecat list --all --json | python3 -c "import sys,json;print(sum(1 for r in json.load(sys.stdin) if r.get('state')!='idle'))"
```

> **⛔ CHECK 3 MUST TEST `state != idle`, NOT grep for known-bad values.**
> It originally read `grep -ciE 'working|stalled'` and MISSED a real condition within
> 15 minutes of going live: on 2026-09-01T17:46Z the overseer escalated two stuck
> polecats while this check reported zero, because minuteman was `state=review-needed`
> — a genuine non-idle state that is in neither 'working' nor 'stalled'.
> **AN ENUMERATION IS ONLY AS GOOD AS THE AUTHOR'S IMAGINATION ON THE DAY.**
> (Accuracy note: 'working' and 'stalled' ARE real states — the grep was INCOMPLETE,
> not dead. Do not repeat the stronger always-passes claim; it was checked and is false.)
>
> **DO NOT add `needs_recovery` / `verdict=NEEDS_RECOVERY` to this trigger.** All 28
> polecats currently carry it — a NORMALIZED STANDING BACKLOG, not work in flight.
> Folding it in would make triage permanently non-empty and rebuild the always-full
> wake this mechanism exists to kill. `gt sling`'s reuse path services it on demand.
>
> **DIVISION OF LABOR (mayor ruling hq-wisp-vi07) — this is not a gap:**
> **TRIAGE DETECTS WORK. The OVERSEER-TO-MAYOR MAIL ROUTE DETECTS MAINTENANCE.**
> A polecat that is `state=idle` but needs recovery (e.g. scavenger) is invisible to
> this check BY DESIGN — the overseer's dashboard sees what no in-town instrument
> watches and routes it to the mayor. Nothing waits on deacon triage for that.

**Then branch on the result:**
- **ANY non-empty** -> REAL WORK. Reset the counter and run a full patrol:
  ```bash
  gt agents state hq-deacon --set idle=0
  ```
- **ALL THREE empty** -> SPURIOUS WAKE. **Do NOT reset idle:N.** Record the
  spurious wake (actor + event type) and RESUME THE BACKOFF CLIMB where it was.

**SAFETY PROPERTY, stated so this change is auditable:** you still WAKE and LOOK on
every single signal. Nothing that those three checks would catch can be slept
through, because real work always manifests in at least one of them. What changes
is only whether a *look that found nothing* is allowed to reset the backoff.

**THIS IS AN INTERIM, AND IT IS SEAT-SIDE — which is exactly the drift risk it
exists to work around.** The fix of record is destination-side: `await-signal`
gains an actor/type filter so every seat benefits and no one hand-rolls this.
Tracked on **hq-zj0l**, routed beside hq-qi3a. Do not mistake this block for the fix.

**On timeout** (no activity):
The idle counter was auto-incremented. Continue to next patrol cycle
(the longer backoff will apply next time).

`await-signal` timeout is normal idle control flow. Do not escalate it as a Dolt
outage unless `gt dolt status` or `gt health --json` proves Dolt is unreachable.
If an outer shell/tool timeout interrupts this command while Dolt is healthy,
escalate at MEDIUM at most with fingerprint `deacon:await-signal:hq-deacon` and
include the timeout, agent bead, and Dolt status in the reason.

## Effort-Based Patrol Routing

After await-signal returns, check the EFFORT directive in the output:

**If `EFFORT: full`** — Run all steps thoroughly (normal patrol).

**If `EFFORT: reduced`** — Run ABBREVIATED patrol:
- brief-in: ALWAYS run
- heartbeat: ALWAYS run
- inbox-check: Quick drain only, skip individual messages unless HELP/RECOVERED_BEAD
- orphan-process-cleanup through fire-notifications: SKIP all
- heartbeat-mid: SKIP
- health-scan: Quick status checks only, skip nudges
- dolt-health through session-gc: SKIP all
- wisp-compact through log-maintenance: SKIP all
- patrol-cleanup: Quick inbox check only
- context-check: One-sentence self-assessment
- served-wisp-audit: ALWAYS run

Abbreviated patrol should complete in ~10% of the tokens of a full patrol.
Mark skipped steps as SKIP in the patrol report.

After await-signal returns (either by signal or timeout):
1. Generate a brief summary of this patrol cycle's observations
2. Build a step audit: for each step in this formula, record whether you
   executed it (OK) or skipped it (SKIP). This makes shortcutting visible
   in the ledger. Format: comma-separated step_id:STATUS pairs.
3. Close current patrol and start next cycle:
```bash
gt patrol report --summary "<brief summary>" \
  --steps "heartbeat:OK,inbox-check:OK,orphan-process-cleanup:SKIP,..."
```
The --steps flag is REQUIRED. List ALL 28 steps with their actual status.
Steps you executed get OK, steps you skipped get SKIP.
This closes the current patrol wisp and automatically creates a new one.
4. Hand off immediately so a fresh Deacon session picks up the newly-created
   patrol wisp from the hook:
```bash
gt handoff -s "Deacon patrol handoff" -m "Patrol cycle reported; continue with the newly-created patrol wisp from hook."
```

Do NOT end your turn at the prompt after `gt patrol report`. The handoff is
mandatory even when context is low; otherwise the patrol loop can stall between
cycles with work waiting on the hook.

**If context HIGH** (approaching limit):
1. Include notable observations in the same handoff message:
```bash
gt handoff -s "Deacon patrol handoff" -m "<observations>"
```
2. Exit cleanly - the daemon will respawn a fresh Deacon session

**IMPORTANT**: You must either report and loop (context LOW) or exit (context HIGH).
Never leave the session idle without work on your hook."""
