# 3. Verify by re-reading the stored text — the update's own output is not evidence:
bd show <next-wisp-id> | grep -c 'PROHIBITED'
```

**PRE-EXECUTION CHECK, binds every seat (deacon, witness, refinery), armed at the
gastown witness seat 2026-09-01):** at session start, read the HOOKED WISP'S OWN step
